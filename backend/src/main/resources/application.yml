micronaut:
  application:
    name: dify-external-knowledge
  server:
    port: 8080
    cors:
      enabled: true
      allowed-origins:
        - "*"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: Content-Type,Authorization

# Cache Configuration
cache:
  config-cache:
    max-size: 1000
    expire-after-write: 300s

# Datasources Configuration
# Required environment variables:
#   DB_HOST     - Database host (default: localhost)
#   DB_PORT     - Database port (default: 3306)
#   DB_NAME     - Database name (default: dify_external)
#   DB_USERNAME - Database username
#   DB_PASSWORD - Database password
datasources:
  default:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dify_external}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    dialect: MYSQL

# Logging Configuration
logger:
  levels:
    com.manleytech: DEBUG
    io.micronaut.http.client: DEBUG
