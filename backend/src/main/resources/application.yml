micronaut:
  application:
    name: dify-external-knowledge
  server:
    port: 8080
    cors:
      enabled: true
      allowed-origins:
        - "*"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: Content-Type,Authorization

# Cache Configuration
cache:
  config-cache:
    max-size: 1000
    expire-after-write: 300s

# Datasources Configuration
# IMPORTANT: Replace with your actual database credentials
# Do NOT commit real credentials to version control
datasources:
  default:
    url: jdbc:mysql://localhost:3306/dify_external?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false
    username: CHANGEME_USERNAME
    password: CHANGEME_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
    dialect: MYSQL

# Logging Configuration
logger:
  levels:
    com.manleytech: DEBUG
    io.micronaut.http.client: DEBUG
